[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comsol-mcp"
version = "0.1.13"
description = "Visible attach-first MCP server for COMSOL Multiphysics Server and Desktop clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "mr jiang", email = "jiang-jc24@mails.tsinghua.edu.cn" }
]
dependencies = [
  "mcp>=1.30,<2",
  "MPh",
  "JPype1"
]

keywords = ["comsol", "mcp", "simulation", "multiphysics", "desktop", "server"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = ["pytest"]
desktop = [
  "pywin32==312; sys_platform == 'win32'",
  "psutil; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-CoreMedia>=12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=12.2.2; sys_platform == 'darwin'"
]

[project.scripts]
comsol-mcp = "comsol_mcp.mcp_server:main"
comsol-mcp-state = "comsol_mcp._state_backup:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["comsol_mcp*"]

[tool.pytest.ini_options]
markers = [
  "comsol_server: requires a live COMSOL Multiphysics Server",
]
addopts = "-m 'not comsol_server'"
testpaths = ["tests"]

[tool.setuptools.package-data]
comsol_mcp = ["phase1_java/*.java", "worker_java/*.java", "data/g2/*.json", "data/science_recipes/*.json", "data/science_recipes/java/*.java", "data/science_recipes/w22_source/*.json", "data/science_recipes/w22_source/*.txt"]
